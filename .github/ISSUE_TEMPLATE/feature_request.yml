name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should FolderGlimpse solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the smallest useful behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Explorer and keyboard safety considerations
      description: Could this affect focus, shortcut ownership, elevation, privacy, or performance?
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the documented roadmap.
          required: true
