name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-smoke:
    # Keep this name aligned with the required protected-branch status check.
    name: Build
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FolderGlimpse.sln --configfile NuGet.config

      - name: Build Release
        run: dotnet build FolderGlimpse.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Run tests
        run: dotnet run --project tests/FolderGlimpse.Tests/FolderGlimpse.Tests.csproj -c Release --no-build

      - name: Run WPF interaction tests
        run: dotnet run --project tests/FolderGlimpse.UiTests/FolderGlimpse.UiTests.csproj -c Release --no-build

      - name: Publish unsigned smoke-test build
        run: >-
          dotnet publish src/FolderGlimpse/FolderGlimpse.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=0.0.0-ci.1
          -p:FileVersion=0.0.0.0
          -p:ContinuousIntegrationBuild=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o artifacts/ci

      - name: Launch smoke test
        shell: pwsh
        run: |
          $capture = Join-Path $env:RUNNER_TEMP 'FolderGlimpse-ci-home.png'
          & artifacts/ci/FolderGlimpse.exe "--capture-main=$capture" --capture-section=Home --capture-theme=Dark
          for ($attempt = 0; $attempt -lt 30 -and -not (Test-Path -LiteralPath $capture); $attempt++) {
            Start-Sleep -Milliseconds 500
          }
          if (-not (Test-Path -LiteralPath $capture) -or (Get-Item -LiteralPath $capture).Length -lt 1000) {
            throw 'The published application did not complete its deterministic UI smoke test.'
          }

      - name: Confirm CI build is unsigned
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath artifacts/ci/FolderGlimpse.exe
          if ($signature.Status -ne 'NotSigned') {
            throw "Pull-request and CI builds must remain unsigned; found $($signature.Status)."
          }

      - name: Test release tooling and fail-closed gates
        shell: pwsh
        run: ./scripts/Test-ReleaseTooling.ps1 -PublishedExecutable artifacts/ci/FolderGlimpse.exe -Version 0.0.0-ci.1
