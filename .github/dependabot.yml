version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    commit-message:
      prefix: "chore(deps)"
